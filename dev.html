<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohit Misra</title>
<meta name="description" content="Mohit Misra, full-stack developer in Berhampur, Odisha. Builds web apps with FastAPI, React and Postgres, and the AI features inside them.">
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="img/coder.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0A0A0B; --surface:#121214; --ink:#EDEDEB; --ink-2:#C4C3BE; --muted:#86857F; --line:#1F1F22; --line-2:#2C2C30;
  --link:#8FB0FF; --ok:#3DD68C;
  --navy:#0E1A35; --slate:#111419; --orange:#1F140B;
  --sans:'Geist',system-ui,-apple-system,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06); --glow:#16203A;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#FBFBFA; --surface:#FFFFFF; --ink:#111110; --ink-2:#3D3C39; --muted:#75736D; --line:#E8E6E1; --line-2:#D9D6CF;
  --link:#1F4FD8; --ok:#1A9A55;
  --navy:#0D1830; --slate:#EEF1F5; --orange:#FFF2E8;
  --shadow:0 30px 60px -20px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.08); --glow:#E4EAF8;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{transition:background .25s,color .25s;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
img{max-width:100%;height:auto;display:block}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.read{max-width:640px}
.label{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.tlink{color:var(--link);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--link) 35%,transparent);text-underline-offset:3px}
.tlink:hover{text-decoration-color:currentColor}
.arrow::after{content:" ↗";font-size:.9em}

/* reveal: subtle, opacity + small rise only */
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;text-decoration:none;letter-spacing:-.01em}
.brand img{width:30px;height:30px;border-radius:8px}
.nav nav{display:flex;gap:4px}
.nav nav a{font-size:14px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;transition:color .15s,background .15s}
.nav nav a:hover{color:var(--ink);background:var(--line)}
@media (max-width:560px){.nav nav a.opt{display:none}}

.theme{all:unset;cursor:pointer;width:34px;height:34px;margin-left:6px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line-2);transition:color .15s,border-color .15s,background .15s}
.theme:hover{color:var(--ink);border-color:var(--muted)}
.theme:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.theme svg{width:16px;height:16px}
.theme .sun{display:none}
:root[data-theme="light"] .theme .sun{display:block}
:root[data-theme="light"] .theme .moon{display:none}
.nav nav{align-items:center}

/* page background: rippling dot grid (canvas) */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:56px;align-items:end;padding-top:88px;padding-bottom:96px}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:40px;padding-top:56px;padding-bottom:72px}}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px 5px 10px;margin-bottom:28px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--link);box-shadow:0 0 0 3px color-mix(in srgb,var(--link) 18%,transparent)}
.hero h1{font-size:clamp(36px,5.2vw,62px);line-height:1.04;letter-spacing:-.035em;font-weight:600;margin-bottom:28px}
.hero h1 span{color:var(--muted)}
.hero p{font-size:17.5px;color:var(--ink-2);margin-bottom:14px;max-width:600px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-size:14.5px;font-weight:500;text-decoration:none;transition:transform .15s var(--ease),background .15s,border-color .15s}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.dark:hover{background:color-mix(in srgb,var(--ink) 86%,var(--bg))}
.btn.line{border:1px solid var(--line-2);background:var(--surface)}
.btn.line:hover{border-color:var(--muted)}
.now{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px}
.now .head{display:flex;justify-content:space-between;padding:10px 12px 8px}
.now a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border-radius:10px;text-decoration:none;transition:background .15s}
.now a:hover{background:var(--bg)}
.now b{display:block;font-weight:500;font-size:15px}
.now small{display:block;font-size:13.5px;color:var(--muted)}
.now .yr{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.now .foot{border-top:1px solid var(--line);margin-top:6px;padding:12px 12px 6px;display:flex;justify-content:space-between}

/* sections */
section{padding:96px 0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:40px;flex-wrap:wrap}
.sh h2{font-size:clamp(28px,3.4vw,38px);letter-spacing:-.03em;font-weight:600;line-height:1.1}

/* project cards */
.proj{border:1px solid var(--line);background:var(--surface);border-radius:22px;overflow:hidden;margin-bottom:28px}
.proj-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;padding:clamp(22px,3.4vw,40px)}
@media (max-width:820px){.proj-top{grid-template-columns:1fr;gap:22px}}
.proj h3{font-size:clamp(23px,2.5vw,30px);letter-spacing:-.025em;font-weight:600;line-height:1.15;margin-bottom:10px}
.proj .sum{font-size:16.5px;color:var(--ink-2)}
.proj .links{display:flex;gap:16px;margin-top:18px;font-size:14.5px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:14px;align-content:start}
.facts dt{color:var(--muted);font-family:var(--mono);font-size:12.5px;padding-top:2px}
.facts dd{color:var(--ink-2)}
.stage{padding:clamp(20px,4vw,52px) clamp(16px,5vw,64px) 0;overflow:hidden}
.stage.navy{background:var(--navy)}
.stage.orange{background:var(--orange)}
.stage.slate{background:var(--slate)}
.stage.pad{padding-bottom:clamp(20px,4vw,52px)}
.stage + .stage.pad{border-top:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.glabel{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:14px}
.stage.navy .glabel,.stage.navy .gnote{color:#9AA8C4}
.browser{border-radius:12px 12px 0 0;overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.browser .bar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:color-mix(in srgb,var(--surface) 92%,var(--ink));border-bottom:1px solid var(--line)}
.browser .bar i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.browser .bar .open{margin-left:auto;font-size:12.5px;color:var(--muted);text-decoration:none}
.browser .bar .open:hover{color:var(--ink)}
.browser .bar .hint{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:14px;display:flex;align-items:center;gap:6px}
.browser .bar .hint::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
@media (max-width:640px){.browser .bar .hint{display:none}}
.viewport{position:relative;aspect-ratio:1440/900;overflow:hidden;background:var(--bg)}
.viewport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;transition:opacity .4s}
.viewport iframe{position:absolute;top:0;left:0;width:1440px;height:900px;border:0;transform-origin:0 0;opacity:0;transition:opacity .4s}
.viewport.ready iframe{opacity:1}
.viewport.ready img{opacity:0}
.browser .bar span{margin-left:12px;font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--bg);padding:3px 10px;border-radius:6px}
.detail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;padding:clamp(22px,3.4vw,40px);border-top:1px solid var(--line)}
@media (max-width:820px){.detail{grid-template-columns:1fr;gap:26px}}
.detail p{color:var(--ink-2);margin-bottom:14px}
.detail h4{font-size:13px;font-family:var(--mono);font-weight:500;color:var(--muted);margin-bottom:12px}
.detail ol{list-style:none;counter-reset:n}
.detail ol li{counter-increment:n;position:relative;padding:0 0 14px 34px;font-size:15px;color:var(--ink-2)}
.detail ol li::before{content:counter(n,decimal-leading-zero);position:absolute;left:0;top:2px;font-family:var(--mono);font-size:12px;color:var(--muted)}

/* bento gallery */
.bento{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:14px}
.bento .tile{all:unset;cursor:zoom-in;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px var(--line);transition:transform .25s var(--ease),box-shadow .25s}
.bento .tile:hover{transform:translateY(-3px);box-shadow:0 0 0 1px var(--line-2),0 14px 30px -14px rgba(0,0,0,.25)}
.bento .tile:focus-visible{box-shadow:0 0 0 2px var(--link)}
.bento .tile.big{grid-column:span 2;grid-row:span 2}
.bento .tile img{width:100%;aspect-ratio:1916/945;object-fit:cover;object-position:top left}
.bento .tile.big img{aspect-ratio:auto;flex:1;min-height:0;height:100%}
.bento .cap{padding:10px 12px 12px;border-top:1px solid var(--line)}
.bento .cap b{display:block;font-size:13.5px;font-weight:500}
.bento .cap span{display:block;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
@media (max-width:900px){.bento{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.bento{grid-template-columns:1fr}.bento .tile.big{grid-column:auto;grid-row:auto}.bento .tile.big img{aspect-ratio:1916/945}}
.gnote{font-size:13px;color:var(--muted);margin-top:16px}

/* system design diagrams */
.arch{--k-client:var(--ink-2);--k-edge:#E0A15E;--k-app:var(--link);--k-ai:#D58CF0;--k-data:var(--ok);--k-queue:#F0B429;--k-ext:var(--muted);
  border:1px solid var(--line);background:var(--surface);border-radius:22px;overflow:hidden}
.arch-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.arch-tabs{display:flex;gap:6px;flex-wrap:wrap}
.arch-tabs button,.arch-mode button{font:inherit;font-size:13.5px;cursor:pointer;border-radius:9px;padding:7px 12px;border:1px solid transparent;background:none;color:var(--muted);transition:color .15s,background .15s,border-color .15s}
.arch-tabs button:hover,.arch-mode button:hover:not(:disabled){color:var(--ink)}
.arch-tabs button[aria-selected="true"]{color:var(--ink);background:var(--bg);border-color:var(--line-2)}
.arch-mode{display:flex;gap:2px;padding:3px;border:1px solid var(--line-2);border-radius:11px;background:var(--bg)}
.arch-mode button{padding:5px 11px;font-size:13px}
.arch-mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line-2)}
.arch-mode button:disabled{opacity:.4;cursor:not-allowed}
.arch-sum{padding:16px 22px 0;color:var(--ink-2);font-size:15px;max-width:860px}
.arch-body{display:block}
.arch-canvas{overflow-x:auto;padding:12px 14px 6px}
.arch-canvas svg{display:block;width:100%;min-width:760px;height:auto}
.arch-panel{border-top:1px solid var(--line);padding:20px 22px;font-size:14.5px;min-height:170px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 40px;align-content:start}
@media (max-width:820px){.arch-panel{grid-template-columns:1fr}}
.arch-panel .lbl:first-child{margin-top:0}
.arch-panel .k{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:8px}
.arch-panel .k i{width:8px;height:8px;border-radius:2px}
.arch-panel h3{font-size:19px;font-weight:600;letter-spacing:-.015em;margin-bottom:4px}
.arch-panel .ps{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.arch-panel p{color:var(--ink-2);margin-bottom:12px}
.arch-panel code{font-family:var(--mono);font-size:12px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;display:inline-block;line-height:1.5}
.arch-panel .talk{border-left:2px solid var(--link);padding-left:12px;color:var(--ink)}
.arch-panel .lbl{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:14px 0 6px}
.arch-panel .hint{color:var(--muted)}
.arch-foot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 40px;padding:18px 22px 22px;border-top:1px solid var(--line);align-items:start}
@media (max-width:820px){.arch-foot{grid-template-columns:1fr}}
.arch-legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted);max-width:260px}
.arch-legend span{display:inline-flex;align-items:center;gap:6px}
.arch-legend i{width:9px;height:9px;border-radius:2px}
.arch-notes{list-style:none;display:grid;gap:8px}
.arch-notes li{position:relative;padding-left:18px;font-size:14.5px;color:var(--ink-2)}
.arch-notes li::before{content:"";position:absolute;left:2px;top:.7em;width:7px;height:1.5px;background:var(--link)}
#arch-svg{color:var(--muted)}
#arch-svg .grp rect{fill:none;stroke:var(--line-2);stroke-dasharray:5 5}
#arch-svg .grp text{font:500 11.5px var(--mono);fill:var(--muted)}
#arch-svg .edge path{fill:none;stroke:var(--line-2);stroke-width:1.5;transition:stroke .2s,opacity .2s}
#arch-svg .edge.flow path{stroke-dasharray:5 6;animation:dash 1.4s linear infinite}
#arch-svg .edge.dashed path{stroke-dasharray:3 5}
#arch-svg .edge text{font:500 10.5px var(--mono);fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
#arch-svg .edge.hot{color:var(--link)}
#arch-svg .edge.hot path{stroke:var(--link)}
#arch-svg .edge.hot text{fill:var(--ink)}
#arch-svg .edge.dim{opacity:.25}
#arch-svg .node{cursor:pointer;outline:none;transition:opacity .2s}
#arch-svg .node rect.box{fill:var(--surface);stroke:var(--line-2);stroke-width:1.2;transition:stroke .2s,fill .2s}
#arch-svg .node .t{font:600 13px var(--sans);fill:var(--ink)}
#arch-svg .node .s{font:400 10.5px var(--mono);fill:var(--muted)}
#arch-svg .node:hover rect.box,#arch-svg .node:focus-visible rect.box{stroke:var(--muted)}
#arch-svg .node.sel rect.box{stroke:var(--link);stroke-width:2;fill:color-mix(in srgb,var(--link) 7%,var(--surface))}
#arch-svg .node.dim{opacity:.45}
#arch-svg .node.ext rect.box{stroke-dasharray:4 4}
@keyframes dash{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion:reduce){#arch-svg .edge.flow path{animation:none}}

/* side projects */
.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px;margin-top:14px}
.side div{border:1px dashed var(--line-2);border-radius:var(--r);padding:22px}
.side b{font-size:16px;font-weight:600;display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.side b small{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted)}
.side p{font-size:14.5px;color:var(--ink-2)}

/* experience */
.jobs{border-top:1px solid var(--line)}
.job{display:grid;grid-template-columns:180px minmax(0,1fr);gap:8px 40px;padding:30px 0;border-bottom:1px solid var(--line)}
.job .when{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:4px}
.job h3{font-size:19px;font-weight:600;letter-spacing:-.015em}
.job .org{color:var(--muted);font-size:15px;margin-bottom:12px}
.job ul{list-style:none}
.job li{position:relative;padding-left:18px;margin-bottom:7px;color:var(--ink-2);font-size:15.5px}
.job li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:1px;background:var(--muted)}
@media (max-width:700px){.job{grid-template-columns:1fr}.job .when{padding-top:0}}

/* skills */
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.skills{grid-template-columns:1fr}}
.skill{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:20px}
.skill .label{margin-bottom:8px}
.skill p{font-size:15px;color:var(--ink-2)}
.edu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;margin-top:56px}
@media (max-width:820px){.edu{grid-template-columns:1fr;gap:28px}}
.edu .label{margin-bottom:10px}
.edu ul{list-style:none}
.edu li{font-size:15px;color:var(--ink-2);margin-bottom:8px}

/* contact */
.contact{border-radius:22px;background:radial-gradient(120% 140% at 0% 0%,var(--glow) 0%,var(--surface) 55%);border:1px solid var(--line-2);color:var(--ink);padding:clamp(28px,5vw,64px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:end}
@media (max-width:820px){.contact{grid-template-columns:1fr}}
.contact h2{font-size:clamp(30px,4vw,46px);letter-spacing:-.035em;font-weight:600;line-height:1.05;margin-bottom:16px}
.contact p{color:var(--ink-2);font-size:16.5px}
.contact .rows a{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-2);text-decoration:none;font-size:15.5px}
.contact .rows a span{color:var(--muted);font-family:var(--mono);font-size:12.5px}
.contact .rows a:hover b{text-decoration:underline;text-underline-offset:3px}
.contact .rows b{font-weight:500}
footer{padding:36px 0 48px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}

/* lightbox */
dialog{margin:auto;border:none;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(1400px,94vw);box-shadow:0 40px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(8,8,7,.78);backdrop-filter:blur(4px)}
dialog .cap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 16px;font-size:14px;color:var(--muted)}
dialog .cap b{color:var(--ink);font-weight:500}
dialog button{font:inherit;font-size:13.5px;background:none;border:1px solid var(--line-2);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<header class="nav" id="nav"><div class="wrap">
  <a class="brand" href="index.html"><img src="img/coder.svg" width="30" height="30" alt=""><span id="name"></span></a>
  <nav>
    <a href="#work">Work</a>
    <a href="#architecture" class="opt">System design</a>
    <a href="#experience" class="opt">Experience</a>
    <a href="#skills" class="opt">Skills</a>
    <a href="#contact">Contact</a>
    <button class="theme" id="theme" type="button" aria-label="Switch to light theme" title="Toggle theme">

<script>
(function(){
  const C = window.CONTENT, $ = id => document.getElementById(id);
  const host = u => u.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
  const ext = (href, label, cls = 'tlink arrow') => `<a class="${cls}" href="${href}" target="_blank" rel="noopener">${label}</a>`;
  const lis = arr => arr.map(x => `<li>${x}</li>`).join('');

  document.title = C.siteTitle;
  document.querySelector('meta[name="description"]').content = C.metaDescription;
  $('name').textContent = C.name;

  // hero
  $('status').textContent = C.intro.status;
  const h = C.intro.heading, cut = h.indexOf(', and ');
  $('hero-h').innerHTML = cut > 0 ? `${h.slice(0, cut + 1)} <span>${h.slice(cut + 2)}</span>` : h;
  $('hero-p').innerHTML = C.intro.paragraphs.map(p => `<p>${p}</p>`).join('');
  $('hero-ctas').innerHTML =
    `<a class="btn dark" href="#work">See my work</a>` +
    `<a class="btn line" href="mailto:${C.contact.email}">Email me</a>` +
    (C.showResume ? `<a class="btn line" href="${C.resumeFile}" download>Résumé (PDF)</a>` : '');
  $('role').textContent = C.location;
  $('now').innerHTML = C.intro.now.map(n => `
    <a href="${n.url}" target="_blank" rel="noopener"><span><b>${n.org}</b><small>${n.role}</small></span><span class="yr">since ${n.since} ↗</span></a>`).join('');
  const tick = () => $('clock').textContent = new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' }) + ' IST';
  tick(); setInterval(tick, 30000);

  // projects
  $('projects').innerHTML = C.work.map(w => `
    <article class="proj rv" id="${w.id}">
      <div class="proj-top">
        <div>
          <h3>${w.title}</h3>
          <p class="sum">${w.summary}</p>
          ${w.url ? `<div class="links">${ext(w.url, 'Visit ' + w.urlLabel)}</div>` : ''}
        </div>
        <dl class="facts">
          <dt>Where</dt><dd>${w.meta}</dd>
          <dt>Stack</dt><dd>${w.stack}</dd>
        </dl>
      </div>
      ${w.image ? `<div class="stage ${w.tint}"><div class="browser">
          <div class="bar"><i></i><i></i><i></i><span>${host(w.url)}</span><em class="hint">live · scroll and click inside</em>${ext(w.url, 'Open', 'open arrow')}</div>
          <div class="viewport">
            <img src="${w.image}" alt="${w.imageAlt}" width="1440" height="900" loading="lazy">
            ${w.embed === false ? '' : `<iframe data-src="${w.url}" title="${w.urlLabel}, live site" loading="lazy" referrerpolicy="no-referrer"></iframe>`}
          </div></div></div>` : ''}
      ${w.gallery ? (() => {
        // one large tile when the rest fill whole rows of four (5, 9, 13 ...); otherwise equal tiles
        const n = w.gallery.length, big = n >= 5 && (n - 1) % 4 === 0;
        return `<div class="stage ${w.tint} pad">
          ${w.galleryTitle ? `<div class="glabel">${w.galleryTitle}</div>` : ''}
          <div class="bento" data-w="${w.id}" style="--cols:${big ? 4 : Math.min(n, 4)}">${w.gallery.map((g, i) => `
          <button class="tile${big && i === 0 ? ' big' : ''}" type="button" data-i="${i}" aria-label="Enlarge ${g.title}">
            <img src="${g.src}" alt="${g.title} screen" width="1916" height="945" loading="lazy">
            <div class="cap"><b>${g.title}</b><span>${g.caption}</span></div>
          </button>`).join('')}</div>${w.galleryNote ? `<p class="gnote">${w.galleryNote}</p>` : ''}</div>`;
      })() : ''}
      <div class="detail">
        <div>${w.body.map(p => `<p>${p}</p>`).join('')}</div>
        ${w.notes ? `<div><h4>${w.notesTitle}</h4><ol>${lis(w.notes)}</ol></div>` : ''}
      </div>
    </article>`).join('');

  $('side-title').textContent = C.sideTitle;
  $('side').innerHTML = C.side.map(s => `<div class="rv"><b>${s.title}<small>side project</small></b><p>${s.body}</p></div>`).join('');

  // experience
  $('jobs').innerHTML = C.experience.map(j => `
    <div class="job rv">
      <div class="when">${j.span}</div>
      <div>
        <h3>${j.role}</h3>
        <div class="org">${j.orgUrl ? ext(j.orgUrl, j.org) : j.org}</div>
        <ul>${lis(j.points)}</ul>
      </div>
    </div>`).join('');

  // skills & education
  $('skill-grid').innerHTML = C.skills.map(s => `<div class="skill rv"><div class="label">${s.name}</div><p>${s.text}</p></div>`).join('');
  $('edu').innerHTML = lis(C.education);
  $('pubs').innerHTML = lis(C.publications);
  $('awards').innerHTML = lis(C.awards);

  // contact
  $('contact-p').textContent = C.contact.text;
  $('contact-rows').innerHTML = [
    `<a href="mailto:${C.contact.email}"><b>${C.contact.email}</b><span>Email</span></a>`,
    `<a href="${C.contact.linkedin}" target="_blank" rel="noopener"><b>${host(C.contact.linkedin)}</b><span>LinkedIn ↗</span></a>`,
    `<a href="tel:${C.contact.phone.replace(/\s/g, '')}"><b>${C.contact.phone}</b><span>Phone</span></a>`,
    C.showResume ? `<a href="${C.resumeFile}" download><b>Résumé</b><span>PDF</span></a>` : ''
  ].join('');
  $('foot-l').textContent = `© ${new Date().getFullYear()} ${C.name} · ${C.location}`;

  // live site embeds: render at 1440x900 desktop size, scaled to fit the frame.
  // The screenshot shows until the site loads; iframes start loading near the viewport.
  document.querySelectorAll('.viewport').forEach(vp => {
    const f = vp.querySelector('iframe'); if (!f) return;
    new ResizeObserver(([e]) => { f.style.transform = `scale(${e.contentRect.width / 1440})`; }).observe(vp);
    f.addEventListener('load', () => { if (f.src) vp.classList.add('ready'); });
    new IntersectionObserver(([e], o) => { if (e.isIntersecting) { f.src = f.dataset.src; o.disconnect(); } }, { rootMargin: '400px' }).observe(vp);
  });

  // theme toggle (dark is the default; the choice is remembered per browser)
  const root = document.documentElement, tb = $('theme');
  const syncLabel = () => tb.setAttribute('aria-label', root.dataset.theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme');
  syncLabel();
  tb.addEventListener('click', () => {
    const light = root.dataset.theme !== 'light';
    if (light) root.dataset.theme = 'light'; else delete root.dataset.theme;
    try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
    syncLabel();
  });

  // page background: a dot grid rippling in slow waves; dots near the cursor swell and light up.
  (function(){
    const cv = $('bg'), ctx = cv.getContext('2d');
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const GAP = 26;
    let W = 0, H = 0, mx = -1e4, my = -1e4, raf = 0, last = 0, col = {};
    const readColors = () => { const cs = getComputedStyle(document.documentElement);
      col = { dot: cs.getPropertyValue('--muted').trim(), acc: cs.getPropertyValue('--link').trim(),
              light: document.documentElement.dataset.theme === 'light' }; };
    const resize = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    const draw = now => {
      const t = now / 1000, sy = scrollY * 0.25, boost = col.light ? 1.25 : 1;
      ctx.clearRect(0, 0, W, H);
      for (let y = GAP / 2; y < H; y += GAP) {
        const wy = y + sy;
        for (let x = GAP / 2; x < W; x += GAP) {
          const v = (Math.sin(x * 0.011 + t * 0.55) + Math.sin(wy * 0.015 - t * 0.45) + Math.sin((x + wy) * 0.007 + t * 0.3) + 3) / 6;
          const d = Math.hypot(x - mx, y - my), m = d < 190 ? 1 - d / 190 : 0;
          const hot = v > 0.76 || m > 0.15;
          ctx.globalAlpha = Math.min(1, (0.07 + v * v * 0.38 + m * 0.55) * boost);
          ctx.fillStyle = hot ? col.acc : col.dot;
          ctx.beginPath(); ctx.arc(x, y, 0.7 + v * 1.25 + m * 1.7, 0, 6.283); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    };
    const loop = now => { raf = requestAnimationFrame(loop); if (now - last < 33) return; last = now; draw(now); };
    const start = () => { cancelAnimationFrame(raf); if (still) draw(0); else raf = requestAnimationFrame(loop); };

    readColors(); resize(); start();
    addEventListener('resize', () => { resize(); if (still) draw(0); }, { passive: true });
    addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; }, { passive: true });
    document.addEventListener('pointerleave', () => { mx = my = -1e4; });
    document.addEventListener('visibilitychange', () => document.hidden ? cancelAnimationFrame(raf) : start());
    new MutationObserver(() => { readColors(); if (still) draw(0); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  })();

  // system design diagrams (data in diagrams.js): pick a system, toggle as-built / at-scale, click a box for details
  (function(){
    const D = window.DIAGRAMS, svg = $('arch-svg'); if (!D || !svg) return;
    const NS = 'http://www.w3.org/2000/svg';
    const KINDS = { client: 'Client', edge: 'Edge / proxy', app: 'Service', ai: 'AI model / agent', data: 'Data store', queue: 'Queue / worker', ext: 'External service' };
    const st = { d: 0, mode: 'built', sel: null };
    const W = 170, H = 58, esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const box = n => ({ x: n.x, y: n.y, w: n.w || W, h: n.h || H });
    const anchor = (b, side) => ({ t: [b.x + b.w / 2, b.y], b: [b.x + b.w / 2, b.y + b.h], l: [b.x, b.y + b.h / 2], r: [b.x + b.w, b.y + b.h / 2] })[side];
    const DIR = { t: [0, -1], b: [0, 1], l: [-1, 0], r: [1, 0] };
    // cubic curve between two boxes: sides follow the dominant axis unless forced, e.g. "r-r"
    const edgePath = (a, b, sides) => {
      let s1, s2;
      if (sides) [s1, s2] = sides.split('-');
      else {
        const dx = (b.x + b.w / 2) - (a.x + a.w / 2), dy = (b.y + b.h / 2) - (a.y + a.h / 2);
        if (Math.abs(dx) > Math.abs(dy)) { s1 = dx > 0 ? 'r' : 'l'; s2 = dx > 0 ? 'l' : 'r'; }
        else { s1 = dy > 0 ? 'b' : 't'; s2 = dy > 0 ? 't' : 'b'; }
      }
      const p0 = anchor(a, s1), p3 = anchor(b, s2);
      const span = DIR[s1][0] ? Math.abs(p3[0] - p0[0]) : Math.abs(p3[1] - p0[1]);
      const off = s1 === s2 ? 34 : Math.max(18, span / 2);
      const p1 = [p0[0] + DIR[s1][0] * off, p0[1] + DIR[s1][1] * off], p2 = [p3[0] + DIR[s2][0] * off, p3[1] + DIR[s2][1] * off];
      const mid = [(p0[0] + 3 * p1[0] + 3 * p2[0] + p3[0]) / 8, (p0[1] + 3 * p1[1] + 3 * p2[1] + p3[1]) / 8];
      return { d: `M${p0} C${p1} ${p2} ${p3}`, mid };
    };
    const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
    const view = () => D[st.d][st.mode] || D[st.d].built;
    // squeeze text that would overflow its box (only when the svg is rendered and measurable)
    const fit = (t, text, max) => {
      t.textContent = text;
      if (t.getComputedTextLength && t.getComputedTextLength() > max) { t.setAttribute('textLength', max); t.setAttribute('lengthAdjust', 'spacingAndGlyphs'); }
    };

    const drawPanel = () => {
      const n = view().nodes.find(x => x.id === st.sel);
      if (!n) {
        $('arch-panel').innerHTML = `<div><div class="k">${st.mode === 'scale' ? 'At-scale design' : 'In production today'}</div><h3>${esc(D[st.d].tab)}</h3></div>` +
          `<p class="hint">Select any box to see what it does, where it lives in the code, and the point I'd make about it in an interview.</p>`;
        return;
      }
      const dd = n.detail || {};
      $('arch-panel').innerHTML =
        `<div><div class="k"><i style="background:var(--k-${n.kind})"></i>${KINDS[n.kind]}</div>` +
        `<h3>${esc(n.label)}</h3><div class="ps">${esc(n.sub || '')}</div>` +
        (dd.what ? `<p>${esc(dd.what)}</p>` : '') + `</div><div>` +
        (dd.where ? `<div class="lbl">In the code</div><code>${esc(dd.where)}</code>` : '') +
        (dd.talk ? `<div class="lbl">Interview point</div><p class="talk">${esc(dd.talk)}</p>` : '') + `</div>`;
    };

    const highlight = () => {
      const linked = new Set([st.sel]);
      svg.querySelectorAll('.edge').forEach(g => {
        const hot = !!st.sel && (g.dataset.a === st.sel || g.dataset.b === st.sel);
        if (hot) { linked.add(g.dataset.a); linked.add(g.dataset.b); }
        g.classList.toggle('hot', hot);
        g.classList.toggle('dim', !!st.sel && !hot);
      });
      svg.querySelectorAll('.node').forEach(g => {
        g.classList.toggle('sel', g.dataset.id === st.sel);
        g.classList.toggle('dim', !!st.sel && !linked.has(g.dataset.id));
        g.setAttribute('aria-pressed', g.dataset.id === st.sel);
      });
      drawPanel();
    };

    const draw = () => {
      const d = D[st.d], v = view();
      $('arch-tabs').querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-selected', i === st.d));
      $('arch-mode').querySelectorAll('button').forEach(b => {
        b.disabled = b.dataset.mode === 'scale' && !d.scale;
        b.setAttribute('aria-pressed', b.dataset.mode === st.mode);
        b.title = b.disabled ? 'This flow has no separate at-scale view' : '';
      });
      $('arch-sum').textContent = d.summary;
      $('arch-notes').innerHTML = v.notes.map(t => `<li>${esc(t)}</li>`).join('');
      svg.setAttribute('viewBox', `0 0 1000 ${v.h}`);
      svg.setAttribute('aria-label', `${d.tab} architecture, ${st.mode === 'scale' ? 'at-scale design' : 'as built'}`);
      svg.innerHTML = '<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="1.6"/></marker></defs>';
      (v.groups || []).forEach(g => {
        const G = el('g', { class: 'grp' }, svg);
        el('rect', { x: g.x, y: g.y, width: g.w, height: g.h, rx: 14 }, G);
        el('text', { x: g.x + 14, y: g.y + 18 }, G).textContent = g.label;
      });
      const byId = Object.fromEntries(v.nodes.map(n => [n.id, n])), labels = [];
      v.edges.forEach(([a, b, label, dashed, sides]) => {
        const A = box(byId[a]), B = box(byId[b]), p = edgePath(A, B, sides);
        const G = el('g', { class: 'edge ' + (dashed ? 'dashed' : 'flow'), 'data-a': a, 'data-b': b }, svg);
        el('path', { d: p.d, 'marker-end': 'url(#arr)' }, G);
        // a label wider than a short, level gap would sit on the box borders: lift it above the row
        const gap = Math.max(B.x - (A.x + A.w), A.x - (B.x + B.w)), level = Math.abs((A.y + A.h / 2) - (B.y + B.h / 2)) < 4;
        if (label) labels.push([G, level && gap < label.length * 6.5 + 10 ? [p.mid[0], Math.min(A.y, B.y) - 3] : p.mid, label]);
      });
      v.nodes.forEach(n => {
        const b = box(n);
        const G = el('g', { class: 'node' + (n.kind === 'ext' ? ' ext' : ''), 'data-id': n.id, tabindex: 0, role: 'button', 'aria-label': `${n.label}, ${n.sub || ''}` }, svg);
        el('rect', { class: 'box', x: b.x, y: b.y, width: b.w, height: b.h, rx: 10 }, G);
        el('rect', { x: b.x + 10, y: b.y + 12, width: 4, height: b.h - 24, rx: 2, fill: `var(--k-${n.kind})` }, G);
        fit(el('text', { class: 't', x: b.x + 22, y: b.y + b.h / 2 - 3 }, G), n.label, b.w - 32);
        fit(el('text', { class: 's', x: b.x + 22, y: b.y + b.h / 2 + 14 }, G), n.sub || '', b.w - 32);
      });
      // edge labels go in a top layer, each tied to its edge group for highlighting
      labels.forEach(([G, mid, label]) => {
        const L = el('g', { class: G.getAttribute('class'), 'data-a': G.dataset.a, 'data-b': G.dataset.b }, svg);
        el('text', { x: mid[0], y: mid[1] - 5, 'text-anchor': 'middle' }, L).textContent = label;
      });
      if (!byId[st.sel]) st.sel = null;
      highlight();
    };

    $('arch-tabs').innerHTML = D.map((d, i) => `<button type="button" role="tab" data-i="${i}">${esc(d.tab)}</button>`).join('');
    $('arch-legend').innerHTML = Object.entries(KINDS).map(([k, t]) => `<span><i style="background:var(--k-${k})"></i>${t}</span>`).join('');
    $('arch-tabs').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      st.d = +b.dataset.i; if (!D[st.d].scale) st.mode = 'built'; st.sel = null; draw();
    });
    $('arch-mode').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) { st.mode = b.dataset.mode; draw(); } });
    const pick = e => { const g = e.target.closest('.node'); st.sel = g && st.sel !== g.dataset.id ? g.dataset.id : null; highlight(); };
    svg.addEventListener('click', pick);
    svg.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.node')) { e.preventDefault(); pick(e); } });
    draw();
  })();

  // lightbox
  const lb = $('lb');
  document.querySelectorAll('.bento').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('.tile'); if (!b) return;
    const item = C.work.find(w => w.id === g.dataset.w).gallery[b.dataset.i];
    $('lb-img').src = item.src; $('lb-img').alt = item.title + ' screen';
    $('lb-cap').innerHTML = `<b>${item.title}</b> · ${item.caption}`;
    lb.showModal();
  }));
  lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });

  // nav border + reveal on scroll
  addEventListener('scroll', () => $('nav').classList.toggle('scrolled', scrollY > 8), { passive: true });
  const els = document.querySelectorAll('.rv');
  if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) { els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .08 });
  els.forEach(e => io.observe(e));
})();
</script>
